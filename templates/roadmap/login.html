<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Roadmap</title>
<style>
  :root {
    --bg: #faf7f2;
    --bg-alt: #ffffff;
    --tinta: #1c2b3a;
    --tinta-suave: #5a6b7c;
    --tenue: #8a97a4;
    --linea: #e4ddd2;
    --acento: #c2703d;
    --error: #c0392b;
    --sombra: 0 1px 2px rgba(28,43,58,.05), 0 8px 24px rgba(28,43,58,.06);
    --radio: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --bg-alt: #1b2027;
      --tinta: #e8eaed;
      --tinta-suave: #a8b3be;
      --tenue: #6d7883;
      --linea: #2b323b;
      --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tinta);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .tarjeta-login {
    background: var(--bg-alt);
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    width: 100%;
    max-width: 400px;
    padding: 36px 30px;
  }

  .cabecera {
    text-align: center;
    margin-bottom: 28px;
  }

  .cabecera h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.025em;
  }

  .cabecera p {
    font-size: 14px;
    color: var(--tinta-suave);
    margin: 0;
  }

  .error-box {
    background: color-mix(in srgb, var(--error) 10%, transparent);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13.5px;
    margin-bottom: 20px;
  }

  .campo {
    margin-bottom: 18px;
  }

  .campo label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--tinta-suave);
    margin-bottom: 6px;
  }

  input[type=text], input[type=password] {
    width: 100%;
    font: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--linea);
    border-radius: 9px;
    background: var(--bg);
    color: var(--tinta);
    transition: outline .1s;
  }

  input[type=text]:focus, input[type=password]:focus {
    outline: 2px solid color-mix(in srgb, var(--acento) 45%, transparent);
    outline-offset: -1px;
    border-color: transparent;
  }

  .btn-submit {
    width: 100%;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 11px 22px;
    border-radius: 9px;
    border: 0;
    background: var(--acento);
    color: #fff;
    transition: filter .15s;
    margin-top: 10px;
  }

  .btn-submit:hover {
    filter: brightness(1.08);
  }

  .pie-login {
    text-align: center;
    margin-top: 24px;
    font-size: 13.5px;
    color: var(--tinta-suave);
  }

  .pie-login a {
    color: var(--acento);
    text-decoration: none;
    font-weight: 600;
  }

  .pie-login a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="tarjeta-login">
  <div class="cabecera">
    <h1>Ingresar</h1>
    <p>Introduce tus credenciales para acceder</p>
  </div>

  {% if form.errors or form.non_field_errors %}
  <div class="error-box">
    <strong>Error:</strong> Credenciales incorrectas. Inténtalo de nuevo.
  </div>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    
    <div class="campo">
      <label for="id_username">Usuario</label>
      <input type="text" name="username" autofocus required id="id_username" placeholder="Nombre de usuario">
    </div>

    <div class="campo">
      <label for="id_password">Contraseña</label>
      <input type="password" name="password" required id="id_password" placeholder="Tu contraseña">
    </div>

    <button type="submit" class="btn-submit">Iniciar Sesión</button>
  </form>

  <div class="pie-login">
    ¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate aquí</a>
  </div>
</div>

</body>
</html>
